<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ケミカラ！無機の色クイズ</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22314f;--pink:#ff6b5b;--lav:#3d7cff;--mint:#18b6a4;--sub:#6b7a99;--sun:#ffc93c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Zen Maru Gothic",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#fff6dc 0%,#e6f3ff 55%,#dcf7ef 100%);user-select:none;-webkit-user-select:none}
.pop{font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;font-weight:400}
#tint{position:fixed;inset:0;opacity:0;transition:opacity .5s;z-index:0}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#deco span{position:absolute;bottom:-40px;opacity:.55;animation:float linear infinite}
@keyframes float{to{transform:translateY(-115vh) rotate(200deg)}}
#app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 14px)}
/* header */
.hdr{background:#fffc;backdrop-filter:blur(6px);border-radius:22px;padding:10px 14px;box-shadow:0 6px 18px #3d7cff22}
.hrow{display:flex;align-items:center;gap:8px}
.chap{flex:1;font-size:15px;font-weight:900;line-height:1.2}
.chap small{display:block;color:var(--pink);font-size:11px;font-family:Quicksand}
.home{border:none;background:#eef3fb;color:var(--ink);border-radius:999px;font:inherit;font-weight:900;font-size:12px;padding:6px 10px;cursor:pointer}
.drops{display:flex;gap:4px;margin-top:8px;justify-content:space-between}
.drops svg{flex:1;max-width:26px;height:auto;transition:transform .3s}
.drops svg.now{transform:translateY(-3px) scale(1.15)}
/* stage */
.stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0;perspective:900px}
.card{position:relative;width:100%;max-width:350px;min-height:300px;border-radius:30px;background:#fff;
  box-shadow:0 12px 0 #d6e4f7,0 20px 34px #22314f22;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 18px 40px}
.card::before{content:"";position:absolute;inset:10px;border:3px solid #22314f;border-radius:22px;pointer-events:none}
.card.lv3::before{border-color:#ff6b5b}
.ribbon{position:absolute;top:-12px;left:16px;background:var(--lav);color:#fff;font-family:Quicksand;font-size:15px;padding:5px 14px;border-radius:12px;transform:rotate(-6deg);box-shadow:0 3px 0 #2557c9}
.ribbon.l1{background:var(--mint);box-shadow:0 3px 0 #0f8a7c}.ribbon.l2{background:var(--lav);box-shadow:0 3px 0 #2557c9}.ribbon.l3{background:var(--pink);box-shadow:0 3px 0 #c9483a}
.ribbon.last{background:#ffbf3c;box-shadow:0 3px 0 #d9951a}
.prompt{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:var(--sun);color:var(--ink);font-weight:900;font-size:14px;padding:4px 14px;border-radius:999px;white-space:nowrap}
.formula{font-family:Quicksand,sans-serif;font-size:62px;line-height:1.05;white-space:nowrap;letter-spacing:-.01em}
.formula.m{font-size:44px}.formula.l{font-size:32px}
.formula.w{font-size:28px;white-space:normal;text-align:center;line-height:1.25;font-family:"Zen Maru Gothic",Quicksand,sans-serif;font-weight:900}
.formula sub,.formula sup{font-size:.55em}
.ss{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.55em;line-height:1;margin-left:1px}
.ss sup,.ss sub{font-size:1em;position:static}.ss sup{transform:translateY(-.3em)}.ss sub{transform:translateY(.3em)}
.nm{margin-top:12px;font-weight:900;font-size:16px;color:var(--sub)}
.qm{font-size:40px;color:#c9d6ea;margin-top:6px}
.timer{position:absolute;bottom:22px;left:30px;right:30px;height:10px;border-radius:5px;background:#eef3fb;overflow:hidden}
.timer i{display:block;height:100%;width:100%;transform-origin:left;border-radius:5px;
  background:repeating-linear-gradient(-45deg,#22314f 0 8px,#3d4f75 8px 16px)}
/* reveal */
.flip{animation:flip .5s ease-out}
@keyframes flip{0%{transform:rotateY(90deg) scale(.9)}100%{transform:rotateY(0) scale(1)}}
.res{position:absolute;top:-18px;right:14px;font-size:20px;padding:6px 16px;border-radius:16px;transform:rotate(7deg);color:#fff;z-index:3}
.res.ok{background:var(--mint);box-shadow:0 4px 0 #0f8a7c}.res.ng{background:#9aa0b8;box-shadow:0 4px 0 #6f748c}
.small-f{font-family:Quicksand;font-size:18px;text-align:center}.small-f .ss{font-size:.6em}
.small-n{font-size:12px;color:var(--sub);font-weight:700;margin-top:2px}
.ansrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;width:100%}
.cw{font-size:56px;line-height:1.1;white-space:nowrap;position:relative;padding:0 4px}
.cw.s{font-size:42px}.cw.xs{font-size:30px}.cw.xxs{font-size:22px;white-space:normal;text-align:center}
.cw::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:16px;border-radius:8px;background:var(--hl);opacity:.75;z-index:-1}
.cw span{position:relative;z-index:1}
.hint{margin-top:16px;background:#fff3cf;color:#22314f;border-radius:14px;font-size:12.5px;font-weight:900;padding:7px 12px;text-align:center;line-height:1.5}
/* choices */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:350px}
.ch{border:none;border-radius:18px;background:#fff;color:var(--ink);font:inherit;font-weight:900;font-size:19px;padding:13px 10px;
  display:flex;align-items:center;gap:9px;box-shadow:0 5px 0 #d6e4f7;cursor:pointer;transition:transform .1s}
.ch:active{transform:translateY(3px);box-shadow:0 2px 0 #d6e4f7}
.ch svg{flex:none}
.ch.right{background:#d8f7ec;box-shadow:0 5px 0 #8fdcc3}.ch.wrong{background:#ffe1dd;color:#c9483a;box-shadow:0 5px 0 #f5b8b0}
.ch:disabled{cursor:default}
.qimg{margin-top:8px;max-width:100%;display:flex;justify-content:center}.sc-top svg.struct{position:static;max-height:118px;width:auto !important;max-width:94%}.qimg.sm{margin-top:6px;transform:scale(.85)}
.choices.multi .ch .box{flex:none;width:18px;height:18px;border-radius:6px;border:2.5px solid #c9d6ea;background:#fff}
.choices.multi .ch.sel{background:#e6f0ff;box-shadow:0 5px 0 #9cc0ff}.choices.multi .ch.sel .box{background:var(--lav);border-color:var(--lav)}
.choices.multi .ch.right .box{background:var(--mint);border-color:var(--mint)}
.btn.mgo{max-width:350px;margin-top:12px;background:var(--lav);box-shadow:0 5px 0 #2557c9}
.ch.lg{font-size:15px}.ch.xl{font-size:12.5px;line-height:1.2;padding:13px 8px}
/* fx */
.splash{position:fixed;width:30px;height:30px;border-radius:50%;z-index:0;transform:translate(-50%,-50%) scale(0);transition:transform .6s ease-out,opacity .6s}
.pt{position:fixed;z-index:8;pointer-events:none;font-size:20px;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
.combo{position:absolute;top:6%;left:50%;transform:translateX(-50%);z-index:6;font-size:30px;color:#fff;
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;animation:bounce .7s cubic-bezier(.2,1.8,.4,1);white-space:nowrap;pointer-events:none}
.combo small{font-size:18px}
@keyframes bounce{0%{transform:translateX(-50%) scale(0) rotate(-10deg)}100%{transform:translateX(-50%) scale(1) rotate(-4deg)}}
.wob{animation:wob .45s}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.banner{display:flex;flex-direction:column;align-items:center;gap:10px;animation:bounce2 .7s cubic-bezier(.2,1.8,.4,1);text-align:center}
.banner .big{font-size:56px;color:#fff;-webkit-text-stroke:9px var(--mint);paint-order:stroke fill}
.banner .big.mid{font-size:36px;line-height:1.2}
.banner .big.p{-webkit-text-stroke-color:var(--lav)}.banner .big.g{-webkit-text-stroke-color:var(--pink)}
.banner .sub{background:#fff;border-radius:999px;padding:6px 18px;font-weight:900;font-size:15px;box-shadow:0 4px 0 #d6e4f7}
@keyframes bounce2{0%{transform:scale(0)}100%{transform:scale(1)}}
/* menu */
.menu{width:100%;max-width:400px;text-align:center;overflow:auto;max-height:100%;padding:6px 2px 10px}
.logo{font-size:40px;line-height:1.1;color:var(--sun);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;margin:6px 0 2px}
.logo small{display:block;font-size:17px;color:#fff;-webkit-text-stroke:5px var(--lav)}
.tag{font-size:13px;color:var(--sub);font-weight:700;margin:6px 0 16px}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{position:relative;border:3px solid var(--ink);border-radius:24px;padding:16px 10px 14px;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--ink);text-align:center}
.cc .em{font-size:34px}.cc b{display:block;font-size:16px;margin-top:4px}.cc small{font-family:Quicksand;color:#0006;font-size:12px}
.cc .best{position:absolute;top:-8px;right:-4px;background:#fff;border-radius:999px;font-family:Quicksand;font-size:12px;padding:3px 8px;box-shadow:0 2px 6px #0002}
.tog{display:flex;justify-content:center;gap:0;margin:18px auto 4px;background:#fff;border-radius:999px;padding:4px;width:max-content;box-shadow:0 4px 0 #d6e4f7}
.tog button{border:none;background:none;font:inherit;font-weight:900;font-size:13px;padding:8px 14px;border-radius:999px;color:var(--sub);cursor:pointer}
.tog button.on{background:var(--ink);color:#fff}
.note{font-size:11px;color:var(--sub);margin-top:6px}
/* result */
.result{width:100%;max-width:360px;background:#fff;border-radius:30px;padding:22px 18px;text-align:center;box-shadow:0 12px 0 #d6e4f7,0 20px 34px #22314f22}
.result h2{margin:0;font-size:22px}
.score{font-family:Quicksand;font-size:54px;color:var(--pink);line-height:1.1}
.score small{font-size:20px;color:var(--sub)}
.title-b{display:inline-block;background:#fff3cf;color:var(--ink);font-weight:900;border-radius:999px;padding:5px 16px;margin:4px 0 10px}
.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0 14px}
.ranks{font-size:20px;font-weight:900;line-height:2}
.ranks .r{font-family:Quicksand;font-size:28px;margin-right:10px}
.btn{display:block;width:100%;border:none;border-radius:18px;font:inherit;font-weight:900;font-size:17px;padding:13px;margin-top:10px;cursor:pointer;
  background:var(--pink);color:#fff;box-shadow:0 5px 0 #c9483a}
.btn.sub{background:#eef3fb;color:var(--ink);box-shadow:0 5px 0 #c9d6ea}
/* ===== 捕集法スワイプ ===== */
.tube-top{background:radial-gradient(circle at 50% 40%,#3d4f75,#22314f)}
.ppt{opacity:0;transform:translateY(-46px);transition:opacity .5s,transform .8s cubic-bezier(.3,1.4,.5,1)}
.ppt.on{opacity:1;transform:none}
.pcol{position:absolute;right:14px;bottom:12px;background:#fff;border-radius:999px;font-weight:900;font-size:13px;padding:3px 12px;opacity:0;transform:scale(.6);transition:.3s .5s}
.pcol.on{opacity:1;transform:none}
.stamp2{white-space:nowrap}
.tubecard .stamp2{top:auto;bottom:64px;left:auto;right:8px;transform:rotate(-10deg);font-size:24px;padding:2px 12px}
.kyotsu{display:inline-block;background:#fff;color:var(--pink);border:3px solid var(--pink);font-weight:900;border-radius:999px;padding:4px 14px;font-size:15px;transform:rotate(-3deg)}
.kyotsu b{font-family:Quicksand;font-size:22px}
.cc{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 8px !important}
.cc b{font-size:15px !important;line-height:1.3}
.mtag{margin-top:4px;font-size:10px;font-weight:900;background:#fff9;border-radius:999px;padding:2px 8px}
.cc .new{position:absolute;top:-9px;left:10px;background:var(--pink);color:#fff;font-family:Quicksand;font-size:11px;padding:2px 8px;border-radius:999px}
.lives{color:var(--pink);font-size:15px;letter-spacing:1px;margin-left:6px}.lives .x{color:#cfd6e2}
.bar10{display:flex;gap:3px;margin-top:8px}.bar10 i{flex:1;height:6px;border-radius:3px;background:#e3eaf5}
.sw-wrap{position:relative;width:100%;max-width:350px}
.scard{position:relative;width:100%;background:#fff;border-radius:26px;overflow:hidden;border:3px solid var(--ink);
  box-shadow:0 8px 0 var(--ink);touch-action:none;cursor:grab;transition:transform .35s cubic-bezier(.2,.8,.3,1),opacity .35s}
.scard.drag{transition:none;cursor:grabbing}
.scard.trick{border-color:#ff8a3d;box-shadow:0 8px 0 #ff8a3d}
.scard.boss{border-color:var(--pink);box-shadow:0 8px 0 var(--pink)}
.sc-top{height:140px;position:relative;overflow:hidden}
.sc-top svg{position:absolute;inset:0}
.mol{animation:molf 3s ease-in-out infinite alternate}
@keyframes molf{to{transform:translate(var(--mx),var(--my))}}
.sc-tag{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2;font-weight:900;font-size:13px;padding:3px 12px;border-radius:999px;color:#fff;white-space:nowrap}
.sc-body{padding:12px 16px 12px}
.sc-name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sc-name b{font-size:26px;font-weight:900}
.sc-name .f{font-family:Quicksand;font-size:24px}.sc-name .f sub{font-size:.6em}
.mw{margin-left:auto;font-size:12px;font-weight:900;background:#eef3fb;border-radius:8px;padding:2px 8px}
.sc-desc{font-size:14px;font-weight:700;color:var(--sub);margin:4px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{white-space:nowrap;border:2px solid #c9d6ea;background:#fff;border-radius:999px;font:inherit;font-weight:900;font-size:13px;padding:5px 12px;color:var(--ink);cursor:pointer}
.chip.open{background:#fff3cf;border-color:var(--sun)}
.sc-timer{height:6px;border-radius:3px;background:#eef3fb;margin:10px 0 6px;overflow:hidden}
.sc-timer i{display:block;height:100%;background:var(--ink);transform-origin:left}
.sc-note{font-size:11px;color:var(--sub);text-align:center}
.stamp2{position:absolute;top:40px;left:50%;transform:translateX(-50%) rotate(-12deg);font-size:34px;padding:4px 18px;border:5px solid;border-radius:14px;background:#fffd;z-index:3;animation:bounce2 .35s}
.toast{min-height:44px;text-align:center;font-weight:900;font-size:14px;line-height:1.5;max-width:350px}
.toast .ok{color:var(--mint)}.toast .ng{color:var(--pink)}.toast small{display:block;color:var(--sub);font-size:12px}
.sides{display:flex;justify-content:space-between;width:100%;max-width:350px}
.side{border:none;background:none;font:inherit;font-weight:900;font-size:14px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:130px}
.side .ring{width:76px;height:76px;border-radius:50%;background:#fff;border:4px solid var(--c);display:grid;place-items:center;box-shadow:0 5px 0 var(--c);transition:transform .15s}
.side .arrow{font-size:12px;color:var(--sub)}
.side.hot .ring{transform:scale(1.12);background:color-mix(in srgb,var(--c) 18%,#fff)}
.side.right .ring{background:#d8f7ec;border-color:var(--mint)}.side.wrong .ring{background:#ffe1dd;border-color:var(--pink)}
.sum{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 6px;text-align:left}
.sum td{padding:5px 4px;border-bottom:1px dashed #d6e0ee}
.sum td:first-child{width:22px;color:var(--sub);font-family:Quicksand}
.sum .m{font-weight:900;text-align:right;white-space:nowrap}
.sum .mk{width:20px;text-align:center;font-weight:900}
.sum sub,.sum sup{font-size:.65em}
.save{display:inline-block;background:var(--pink);color:#fff;font-weight:900;border-radius:999px;padding:5px 14px;font-size:13px;transform:rotate(-2deg);margin:4px 0}
.result{max-height:100%;overflow:auto}
</style>
</head>
<body>
<div id="tint"></div>
<div id="deco"></div>
<div id="app">
  <div class="hdr" id="hdr" style="display:none">
    <div class="hrow"><div class="chap" id="chap"></div><button class="home" id="homeBtn">メニュー</button></div>
    <div class="drops" id="drops"></div>
  </div>
  <div class="stage" id="stage"></div>
</div>
<script>
// ================= 共通：色・ユーティリティ（全版で共有） =================
// ================= 色データ =================
const HEX = {"白":"#ffffff","無色":null,"黒":"#2b2b33","黒紫":"#3a2550","褐":"#7b4a2e","赤褐":"#a6432b","黄褐":"#c8952e",
 "赤":"#e8394a","橙赤":"#ff6a3d","紅":"#d81b5a","赤橙":"#f0662a","淡桃":"#f7c4d6","黄":"#ffd23f","淡黄":"#fff1a6",
 "緑":"#2fae5a","淡緑":"#bfe6b4","黄緑":"#b4d94a","緑白":"#dfeedb","青緑":"#19b3a6","青":"#3b82f6","淡青":"#bfe1ff",
 "青白":"#cfe2f5","深青":"#1f3fae","紫":"#8b4fd8","赤紫":"#b2338c","青紫":"#5f52cc"};
const FAM = {white:["白","無色","銀白"],black:["黒","黒紫"],brown:["褐","赤褐","黄褐"],red:["赤","橙赤","紅","赤橙"],pink:["淡桃"],
 yellow:["黄","淡黄"],green:["緑","淡緑","黄緑","緑白","青緑"],blue:["青","淡青","青白","深青"],purple:["紫","赤紫","青紫"]};
const famOf = c => Object.keys(FAM).find(k => FAM[k].includes(c));
const SIMPLE = ["白","黒","赤","黄","緑","青","紫"];
const fx = (b, sub, sup) => `${b}<span class="ss"><sup>${sup}</sup><sub>${sub}</sub></span>`;

Object.assign(HEX, {"銀白":"#dfe3ea", "赤銅":"#c4683c", "灰":"#9aa0a8", "銀":"#c9ced8", "橙黄":"#ffa62b"});
FAM.gray = ["銀","灰"]; FAM.yellow.push("橙黄");
const keyOf = q => q.ans || q.c;
function buildQ(ch) {
  if (ch.swipe) {
    const boss = pickOne(ch.q.filter(x => x.boss)), gs = new Set([boss.g]);  // ボスは候補から毎回ランダム
    const rest = ch.q.filter(x => x !== boss && !(x.g && x.g === boss.g));
    const pick = (d, n) => {
      let g = shuffle(rest.filter(x => x.d === d));
      if (ch.swipe.balance) {
        // 答えが偏らないように、答えごとに交互に並べる
        const by = {}; g.forEach(x => (by[x.ans] = by[x.ans] || []).push(x));
        const keys = shuffle(Object.keys(by)), out = [];
        for (let i = 0; out.length < g.length; i++) keys.forEach(k => { if (by[k][i]) out.push(by[k][i]); });
        g = out;
      }
      // 同じ話題（g）の問題は1回に1問まで
      const out = [];
      for (const x of g) { if (out.length >= n) break; if (x.g && gs.has(x.g)) continue; if (x.g) gs.add(x.g); out.push(x); }
      return out;
    };
    // 話題の重複チェックは難易度の順をランダムにして行う（いつも Lv.1 の問題が優先されないように）
    const got = {}; shuffle([[1, 4], [2, 3], [3, 2]]).forEach(([d, n]) => got[d] = pick(d, n));
    return [...shuffle(got[1]), ...shuffle(got[2]), ...shuffle(got[3]), boss];
  }
  return null;
}

const pickOne = a => a[Math.random() * a.length | 0];

// ================= 共通テストのカウントダウン（毎年自動で更新） =================
// 共通テスト本試験は「1月13日以降の最初の土曜日・日曜日」（2021〜2027年度すべてこの規則どおり）。
// 公式発表と違う年があれば KYOTSU_FIXED に「年: [月-1, 日]」を足せば上書きできる。
const KYOTSU_FIXED = {2027: [0, 16]};   // 2027年度：2027年1月16日(土)・17日(日)（大学入試センター発表）
function kyotsuDay1(y) {
  if (KYOTSU_FIXED[y]) return new Date(y, ...KYOTSU_FIXED[y]);
  const d = new Date(y, 0, 13); while (d.getDay() !== 6) d.setDate(d.getDate() + 1); return d;
}
function nextKyotsu() {
  const t = new Date(new Date().toDateString());
  for (let y = t.getFullYear(); ; y++) { const d1 = kyotsuDay1(y), d2 = new Date(d1); d2.setDate(d1.getDate() + 1); if (d2 >= t) return d1; }
}
const daysToKyotsu = () => Math.round((nextKyotsu() - new Date(new Date().toDateString())) / 864e5);

  const n = daysToKyotsu(), d = nextKyotsu();
  return n > 0 ? `共通テスト（${d.getMonth() + 1}/${d.getDate()}）まで あと<b>${n}</b>日` : "今日は共通テスト！ がんばれ！";

// ================= 構造式の描画（SVG） =================
// 教科書の書き方にそろえた構造式を、データから SVG で描く。
//   chainSVG：高分子の繰り返し単位・単量体（–[CH₂–CH(Cl)]ₙ– のように横に並べる）
//   sugarSVG：糖のハース式（六員環・五員環）。二糖はグリコシド結合でつなぐ
//   fischerSVG：鎖状構造（縦に並べる）
// 文字の下つき数字は「₂」のような Unicode の文字で書く。

const SV_FONT = `font-family="'Hiragino Sans','Zen Maru Gothic',sans-serif" font-weight="700"`;
const svText = (x, y, t, size = 15, anchor = "middle", extra = "") =>
  `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${size}" text-anchor="${anchor}" ${SV_FONT} fill="#22314f" ${extra}>${t}</text>`;
const svLine = (x1, y1, x2, y2, w = 2) => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#22314f" stroke-width="${w}" stroke-linecap="round"/>`;
// 文字の幅の見積もり（下つき文字は細い）
const svWidth = (t, size = 15) => [...t].reduce((a, c) => a + (/[₀-₉ₙ]/.test(c) ? .45 : /[A-Za-z0-9()=+\-]/.test(c) ? .7 : 1) * size, 0);
function svWrap(body, x0, y0, x1, y1, maxW = 320) {
  const w = x1 - x0, h = y1 - y0;
  return `<svg class="struct" viewBox="${x0.toFixed(0)} ${y0.toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}" width="${Math.min(maxW, w * 1.75).toFixed(0)}" style="max-width:100%;height:auto">${body}</svg>`;
}
// ベンゼン環（中心 cx,cy・半径 r）。flat：左右に頂点（つながりは左右）／ pointy：上下に頂点
function svRing(cx, cy, r = 14, flat = true) {
  const a0 = flat ? 0 : -90, P = Array.from({length: 6}, (_, i) => [cx + r * Math.cos((a0 + i * 60) * Math.PI / 180), cy + r * Math.sin((a0 + i * 60) * Math.PI / 180)]);
  let s = P.map((p, i) => svLine(...p, ...P[(i + 1) % 6])).join("");
  // ケクレ構造の二重結合（内側の線を1つおきに）
  for (let i = 0; i < 6; i += 2) { const [a, b] = [P[i], P[(i + 1) % 6]], k = .72;
    s += svLine(cx + (a[0] - cx) * k, cy + (a[1] - cy) * k, cx + (b[0] - cx) * k, cy + (b[1] - cy) * k, 1.6); }
  return {s, P};
}

// ---------- 高分子・単量体（横に並べる） ----------
// nodes：文字列（原子団）または {t, up, dn, b, ring}
//   up/dn：上下の置換基（文字列 ／ "=O" で C=O ／ {ring:1} でフェニル基）
//   b：前の原子団との結合（"-" 単結合・"=" 二重結合・"≡" 三重結合）
//   ring:1：主鎖の中のベンゼン環（p 位でつながる）
//   ring:"o"：OH を上にもち、両どなり（o 位）でつながるベンゼン環（フェノール樹脂）
// opt.br：かっこ［ ］ₙ をつける（高分子）
function chainSVG(nodes, opt = {}) {
  const br = opt.br !== false, BL = 16, Y = 0;
  let x = br ? 22 : 4, body = "", minY = -18, maxY = 18, prevR = null;
  const bond = (x1, x2, b = "-") => {
    if (b === "=") return svLine(x1, Y - 3, x2, Y - 3) + svLine(x1, Y + 3, x2, Y + 3);
    if (b === "≡") return svLine(x1, Y - 5, x2, Y - 5) + svLine(x1, Y, x2, Y) + svLine(x1, Y + 5, x2, Y + 5);
    return svLine(x1, Y, x2, Y);
  };
  const sub = (cx, s, dir) => {   // dir：-1 上・+1 下
    const y1 = Y + dir * 10, y2 = Y + dir * 24;
    if (s === "=O") { body += svLine(cx - 3, y1, cx - 3, y2) + svLine(cx + 3, y1, cx + 3, y2) + svText(cx, Y + dir * 31 + 5, "O"); }
    else if (s && s.ring) { body += svLine(cx, y1, cx, y2); const R = svRing(cx, y2 + dir * 14, 14, false); body += R.s; }
    else { body += svLine(cx, y1, cx, y2) + svText(cx, Y + dir * 31 + 5, s); }
    if (dir < 0) minY = Math.min(minY, s && s.ring ? -60 : -46); else maxY = Math.max(maxY, s && s.ring ? 62 : 40);
  };
  if (br) { body += svLine(4, Y, 22, Y); }
  nodes.forEach((n, i) => {
    n = typeof n === "string" ? {t: n} : n;
    if (i > 0) { body += bond(x, x + BL, n.b); x += BL; }
    else if (br) { /* 左のかっこのあとはそのまま */ }
    if (n.ring === 1) {           // 主鎖の中のベンゼン環（左右の頂点でつながる）
      const R = svRing(x + 14, Y, 14, true); body += R.s; x += 28;
    } else if (n.ring === "o") {  // フェノール樹脂：OH が上、o 位でつながる
      const cx = x + 12, cy = Y + 7, R = svRing(cx, cy, 14, false);   // 上の頂点が OH
      body += R.s + svLine(cx, cy - 14, cx, cy - 26) + svText(cx, cy - 31, "OH");
      body += svLine(x, Y, R.P[5][0], R.P[5][1]) ; // 左上の頂点へ
      minY = Math.min(minY, -40); maxY = Math.max(maxY, 26);
      x = R.P[1][0]; // 右上の頂点から右へ
    } else {
      const w = svWidth(n.t), sw = s => !s ? 0 : s.ring ? 30 : s === "=O" ? 12 : svWidth(s);
      const pad = Math.max(0, (Math.max(sw(n.up), sw(n.dn)) - w) / 2);
      x += pad; body += svText(x + w / 2, Y + 5.5, n.t);
      if (n.up) sub(x + w / 2, n.up, -1);
      if (n.dn) sub(x + w / 2, n.dn, 1);
      x += w + pad;
    }
  });
  if (br) {
    body += svLine(x, Y, x + 18, Y);
    const bh = Math.max(-minY, maxY) - 6;
    body = `<path d="M 16 ${-bh} h -5 v ${2 * bh} h 5" fill="none" stroke="#22314f" stroke-width="2"/>` + body
      + `<path d="M ${x + 8} ${-bh} h 5 v ${2 * bh} h -5" fill="none" stroke="#22314f" stroke-width="2"/>` + svText(x + 20, bh + 4, "n", 14, "start");
    x += 26; maxY = Math.max(maxY, bh + 8);
  }
  return svWrap(body, -2, minY - 4, x + 4, maxY + 6);
}

// ---------- 糖のハース式 ----------

  5: {O: [0, -.6], C2: [.85, -.08], C3: [.56, .6], C4: [-.56, .6], C5: [-.85, -.08], order: ["O", "C2", "C3", "C4", "C5"]},

const SUGAR = {
  "α-glc": {ring: 6, C1: ["H", "OH"], C2: ["H", "OH"], C3: ["OH", "H"], C4: ["H", "OH"], C5: ["CH₂OH", "H"]},
  "β-glc": {ring: 6, C1: ["OH", "H"], C2: ["H", "OH"], C3: ["OH", "H"], C4: ["H", "OH"], C5: ["CH₂OH", "H"]},
  "α-gal": {ring: 6, C1: ["H", "OH"], C2: ["H", "OH"], C3: ["OH", "H"], C4: ["OH", "H"], C5: ["CH₂OH", "H"]},
  "β-gal": {ring: 6, C1: ["OH", "H"], C2: ["H", "OH"], C3: ["OH", "H"], C4: ["OH", "H"], C5: ["CH₂OH", "H"]},
  "β-fru": {ring: 5, C2: ["OH", "CH₂OH"], C3: ["OH", "H"], C4: ["H", "OH"], C5: ["CH₂OH", "H"]},

// 3次元の回転（180°）。x：上下と前後が入れかわる／y：左右と前後／z：左右と上下（紙の面の中で半回転）
const ROT = {x: ([x, y, z]) => [x, -y, -z], y: ([x, y, z]) => [-x, y, -z], z: ([x, y, z]) => [-x, -y, z]};

    G.order.forEach((a, i) => { const b = G.order[(i + 1) % G.order.length], zf = (zOf(a) + zOf(b)) / 2;
      const p1 = pos[a], p2 = pos[b], sh = .16;   // O のまわりは文字の分だけ短く
      const q1 = a === "O" ? {x: p1.x + (p2.x - p1.x) * sh * 1.6, y: p1.y + (p2.y - p1.y) * sh * 1.6} : p1;
      const q2 = b === "O" ? {x: p2.x + (p1.x - p2.x) * sh * 1.6, y: p2.y + (p1.y - p2.y) * sh * 1.6} : p2;
      body += svLine(q1.x, q1.y, q2.x, q2.y, zf > .25 ? 5 : 2); });

      ends[key] = {s, e};

}

// ---------- 鎖状構造（縦に並べる） ----------
// rows：[左, 中央, 右]。中央どうしを縦の結合でつなぐ。中央の "C=O" は右に =O を描く
function fischerSVG(rows) {
  const H = 30; let body = "";
  rows.forEach(([l, c, r], i) => {
    const y = i * H;
    if (i > 0) body += svLine(0, y - H + 10, 0, y - 10);
    if (c === "C=O") { body += svText(0, y + 5, "C") + svLine(8, y - 3, 26, y - 3) + svLine(8, y + 3, 26, y + 3) + svText(34, y + 5, "O"); }
    else body += svText(0, y + 5, c);
    if (l) body += svLine(-8, y, -22, y) + svText(-24, y + 5, l, 14, "end");
    if (r) body += svLine(8, y, 22, y) + svText(24, y + 5, r, 14, "start");
  });
  return svWrap(body, -62, -16, 62, rows.length * H - 10, 160);
}

function collectOpts(q, lv) {
  // 不正解の選択肢は毎回ランダム（後半ほど「ひっかけ」が出やすい）
  const others = Object.keys(METH).filter(m => m !== q.ans && m !== q.alt);
  let d;
  if (q.alt) d = Math.random() < .7 ? q.alt : others[Math.random() * others.length | 0];
  else if (lv >= 2 && q.trap && Math.random() < .7) d = q.trap;
  else d = others[Math.random() * others.length | 0];
  return Math.random() < .5 ? [q.ans, d] : [d, q.ans];
}
const airText = q => q.M < 29 ? `軽い（${q.M} ＜ 29）` : `重い（${q.M} ＞ 29）`;

      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .4); });
  } catch (e) {}
}

function build(ch) {
  const cq = buildQ(ch); if (cq) return cq;
  const n = Math.min(ch.n || 10, ch.q.length);
  const target = n === 10 ? {1:4, 2:4, 3:2} : {1:Math.round(n*.3), 2:Math.round(n*.4), 3:n - Math.round(n*.3) - Math.round(n*.4)};
  const cnt = {}, picked = [], gs = new Set();
  const ok = q => (cnt[q.c] || 0) < (ch.cap[q.c] ?? ch.capAll ?? 2) && !(q.g && gs.has(q.g));   // 同じ話題（g）は1回に1問まで
  const add = q => { picked.push(q); cnt[q.c] = (cnt[q.c] || 0) + 1; if (q.g) gs.add(q.g); };
  for (const d of shuffle([1, 2, 3])) {   // 難易度の順はランダム（「無色は1問まで」などの上限が Lv.1 で先に埋まらないように）
    for (const q of shuffle(ch.q.filter(x => x.d === d))) { if (picked.filter(p => p.d === d).length >= target[d]) break; if (ok(q)) add(q); }
  }
  for (const q of shuffle(ch.q)) { if (picked.length >= n) break; if (!picked.includes(q) && ok(q)) add(q); }
  for (const q of shuffle(ch.q)) { if (picked.length >= n) break; if (!picked.includes(q)) add(q); }
  return picked.sort((a, b) => a.d - b.d);
}
const levelOf = (i, n) => i < Math.round(n * .4) ? 1 : i < Math.round(n * .8) ? 2 : 3;

// 似ている色＝同じ系統 or 名前に同じ漢字を含む（例：黄 と 黄褐、緑 と 淡緑）
const similar = (a, b) => !(cur && cur.noSim) && (famOf(a) === famOf(b) || [...a].some(ch => ch !== "色" && b.includes(ch)));
function choices(q, lv, allow) {
  const set = [q.c];
  const pool = shuffle(allow.filter(c => c !== q.c && (c !== "無色" || c === q.trap)));  // 無色は答え・ひっかけ以外では出さない
  const fillDistinct = list => { for (const c of list) { if (set.length >= 4) break; if (!set.includes(c) && set.every(s => !similar(s, c))) set.push(c); } };
  if (lv === 1) {
    // Lv.1：まぎらわしい色名は出さない（シンプルな色名を優先）
    // 半分の確率でシンプルな色名を優先、残りは全色からランダム（どちらも似た色は出さない）
    fillDistinct(Math.random() < .5 ? [...pool.filter(c => SIMPLE.includes(c)), ...pool] : pool);
  } else {
    // Lv.2：ひっかけ色を1つだけ ／ Lv.3：似た色をどんどん混ぜる
    if (q.trap && allow.includes(q.trap) && (lv === 3 || Math.random() < .75)) set.push(q.trap);
    const near = pool.filter(c => similar(q.c, c) && !set.includes(c));
    near.slice(0, lv === 3 ? 3 : (set.length > 1 ? 0 : 1)).forEach(c => { if (set.length < 4) set.push(c); });
    fillDistinct(pool);
  }
  for (const c of pool) { if (set.length >= 4) break; if (!set.includes(c)) set.push(c); }
  return shuffle(set);
}

// ================= ゲーム進行 =================
async function start(ch) {
  if (ch.swipe) return startSwipe(ch);
  const my = ++run; cur = ch; Q = build(ch); idx = 0; score = 0; combo = 0; got = [];
  $("hdr").style.display = ""; $("chap").innerHTML = `<small>${ch.no}</small>${ch.title}`;
  let lastLv = 1;
  drawDrops();
  await banner(`<div class="kyotsu">${kyotsuBadge()}</div><div class="big pop mid">${ch.title}</div><div class="sub">${Q.length}連チャレンジ！ まずは定番から</div>`, 1700);
  for (idx = 0; idx < Q.length; idx++) {
    if (my !== run) return;
    drawDrops();
    const lv = levelOf(idx, Q.length);
    if (lv !== lastLv) {
      lastLv = lv;
      const B = {1:[`Lv.1`, "", "まずは定番から"], 2:[`Lv.2 ⚡`, "p", "ひっかけ問題が混ざるよ"], 3:[`Lv.3 🔥`, "g", "似た色に注意！"]}[lv];
      await banner(`<div class="big pop ${B[1]}">${B[0]}</div><div class="sub">${B[2]}</div>`, 1300);
      if (my !== run) return;
    }
    await (Q[idx].ms ? askMulti : ask)(Q[idx], lv, my);   // ms がある問題は複数選択
  }
  if (my !== run) return;
  idx = Q.length; drawDrops(); result();
}

async function banner(html, ms) { $("tint").style.opacity = 0; stage.innerHTML = `<div class="banner">${html}</div>`; SE.lv(); await sleep(ms); }

function ask(q, lv, my) {
  return new Promise(resolve => {
    $("tint").style.opacity = 0;
    const last = idx === Q.length - 1;
    const opts = q.opts ? shuffle([q.c, ...shuffle(q.opts.filter(o => o !== q.c)).slice(0, 3)]) : choices(q, lv, cur.allow);
    const LIMIT = AUTO ? 3200 : 8000;
    const LIM = LIMIT * (q.img ? 1.6 : 1);   // 構造式を読む問題は時間を長めに
    stage.innerHTML = `
      <div class="card lv${lv} flip" id="card">
        <div class="ribbon ${last ? "last" : "l" + lv}">${last ? "LAST 👑" : "Lv." + lv}</div>
        <div class="prompt">${q.ask || pickOne(cur.prompts || [cur.prompt])}</div>
        <div class="formula ${q.sz || ""}">${q.fm}</div>
        <div class="nm">${q.nm}</div>
        ${q.img ? `<div class="qimg">${q.img}</div>` : `<div class="qm pop">?</div>`}
        <div class="timer"><i id="tb"></i></div>
      </div>
      ${AUTO ? "" : `<div class="choices">${opts.map(o => `<button class="ch ${o.length > 9 ? "xl" : o.length > 5 ? "lg" : ""}" data-c="${o}">${cur.icon ? cur.icon(o) : drop(o, 20)}${o}</button>`).join("")}</div>`}`;
    $("tb").animate([{transform:"scaleX(1)"},{transform:"scaleX(0)"}], {duration: LIM, fill:"forwards"});
    let done = false, tid;
    const finish = async (pick, el) => {
      if (done || my !== run) return; done = true; clearTimeout(tid);
      const ok = AUTO || pick === q.c;
      stage.querySelectorAll(".ch").forEach(b => { b.disabled = true;
        if (b.dataset.c === q.c) b.classList.add("right"); else if (b.dataset.c === pick) b.classList.add("wrong"); });
      got.push(ok); if (ok) { score++; combo++; } else combo = 0;
      if (!ok) { $("card").classList.add("wob"); SE.ng(); await sleep(500); }
      if (my !== run) return;
      splash(q.c, el);
      reveal(q, ok);
      drawDrops();
      if (ok) { SE.ok(); burst(el); if (combo >= 2) comboText(); }
      await sleep(AUTO ? 2500 : ok ? (q.hint ? 1900 : 1100) : (q.hint ? 2800 : 2000));
      resolve();
    };
    stage.querySelectorAll(".ch").forEach(b => b.onclick = () => finish(b.dataset.c, b));
    tid = setTimeout(() => finish(null, null), LIM);
  });
}

// ================= 複数選択（「何と何？」）：q.ms＝正解の配列、q.opts＝まちがいの候補。全部そろえば正解 =================
function askMulti(q, lv, my) {
  return new Promise(resolve => {
    $("tint").style.opacity = 0;
    const last = idx === Q.length - 1, ans = new Set(q.ms);
    const opts = shuffle([...q.ms, ...shuffle(q.opts.filter(o => !ans.has(o))).slice(0, Math.max(2, 6 - q.ms.length))]);
    const LIMIT = AUTO ? 3200 : 8000;
    const LIM = LIMIT * 1.8;
    const sel = new Set();
    stage.innerHTML = `
      <div class="card lv${lv} flip" id="card">
        <div class="ribbon ${last ? "last" : "l" + lv}">${last ? "LAST 👑" : "Lv." + lv}</div>
        <div class="prompt">${q.ask || "あてはまるものを すべて えらぶ"}</div>
        <div class="formula ${q.sz || ""}">${q.fm}</div>
        <div class="nm">${q.nm}</div>
        ${q.img ? `<div class="qimg">${q.img}</div>` : `<div class="qm pop">?</div>`}
        <div class="timer"><i id="tb"></i></div>
      </div>
      ${AUTO ? "" : `<div class="choices multi">${opts.map(o => `<button class="ch ${o.length > 9 ? "xl" : o.length > 5 ? "lg" : ""}" data-c="${o}"><span class="box"></span>${o}</button>`).join("")}</div>
        <button class="btn mgo" id="mgo">決定（${q.ms.length > 1 ? "いくつか選ぶ" : "1つ選ぶ"}）</button>`}`;
    $("tb").animate([{transform:"scaleX(1)"},{transform:"scaleX(0)"}], {duration: LIM, fill:"forwards"});
    let done = false, tid;
    const finish = async () => {
      if (done || my !== run) return; done = true; clearTimeout(tid);
      const ok = AUTO || (sel.size === ans.size && [...sel].every(o => ans.has(o)));
      stage.querySelectorAll(".ch").forEach(b => { b.disabled = true;
        if (ans.has(b.dataset.c)) b.classList.add("right"); else if (sel.has(b.dataset.c)) b.classList.add("wrong"); });
      if ($("mgo")) $("mgo").disabled = true;
      got.push(ok); if (ok) { score++; combo++; } else combo = 0;
      if (!ok) { $("card").classList.add("wob"); SE.ng(); await sleep(500); }
      if (my !== run) return;
      splash(q.c, $("mgo"));
      reveal(q, ok);
      drawDrops();
      if (ok) { SE.ok(); burst($("card")); if (combo >= 2) comboText(); }
      await sleep(AUTO ? 2500 : ok ? (q.hint ? 2000 : 1300) : 3000);
      resolve();
    };
    stage.querySelectorAll(".ch").forEach(b => b.onclick = () => {
      const c = b.dataset.c; sel.has(c) ? sel.delete(c) : sel.add(c); b.classList.toggle("sel", sel.has(c)); bell([880], .05, .03);
    });
    if ($("mgo")) $("mgo").onclick = finish;
    tid = setTimeout(finish, LIM);
  });
}

function splash(c, el) {
  const r = el ? el.getBoundingClientRect() : $("card").getBoundingClientRect();
  const s = document.createElement("div"); s.className = "splash";
  s.style.left = r.left + r.width / 2 + "px"; s.style.top = r.top + r.height / 2 + "px"; s.style.background = pastel(c);
  document.body.appendChild(s);
  requestAnimationFrame(() => s.style.transform = "translate(-50%,-50%) scale(90)");
  setTimeout(() => { $("tint").style.background = pastel(c); $("tint").style.transition = "none"; $("tint").style.opacity = 1;
    requestAnimationFrame(() => $("tint").style.transition = ""); s.remove(); }, 620);
}

function burst(el) {
  const r = (el || $("card")).getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const ch = ["★","✦","●","▲","✧"], cols = ["#ff6b5b","#3d7cff","#ffc93c","#18b6a4"];
  for (let i = 0; i < 16; i++) {
    const p = document.createElement("div"); p.className = "pt"; p.textContent = ch[i % 5];
    const a = Math.PI * 2 * i / 16, d = 70 + Math.random() * 60;
    p.style.left = cx + "px"; p.style.top = cy + "px"; p.style.color = cols[i % 4];
    p.style.setProperty("--dx", Math.cos(a) * d + "px"); p.style.setProperty("--dy", Math.sin(a) * d + "px"); p.style.setProperty("--r", (Math.random() * 360) + "deg");
    document.body.appendChild(p); setTimeout(() => p.remove(), 950);
  }
}

function comboText() {
  const w = combo >= 6 ? "Perfect!!" : combo >= 4 ? "Excellent!" : combo >= 3 ? "Great!" : "Nice!";

function reveal(q, ok) {

function result() {
  $("tint").style.opacity = 0;
  const n = Q.length, rate = score / n;

        <div><span class="r" style="color:#3d7cff">A</span>${aMin}〜${n - 1}問</div>

    `<h2>${cur.no} ${cur.title}</h2>

    <div style="font-weight:900;margin-top:4px">今日の${Q.length}問まとめ</div>${summaryTable()}<div class="save">スクショして直前に見返そう！</div>
    <button class="btn" id="again">もう一回</button>
    <button class="btn sub" id="back">ほかの単元へ</button>
  </div>`;
  $("again").onclick = () => start(cur);
  $("back").onclick = menu;
}

// ================= スワイプ（2択）モード =================
const SWOPT = m => (cur && cur.swipe ? cur.swipe.opts : METH)[m];
function apparatus(m, s = 46) {
  const o = SWOPT(m); if (o.icon) return o.icon(s);
  const c = o.col;
  if (m === "水上置換") return `<svg width="${s}" height="${s}" viewBox="0 0 48 48">
    <path d="M4 22 V40 Q4 44 8 44 H40 Q44 44 44 40 V22" fill="none" stroke="${c}" stroke-width="3"/>
    <rect x="5.5" y="28" width="37" height="14.5" rx="2" fill="${c}" opacity=".25"/>
    <path d="M18 6 H30 V36 H18 Z" fill="#fff" stroke="${c}" stroke-width="3"/><rect x="19.5" y="22" width="9" height="12.5" fill="${c}" opacity=".25"/>
    <path d="M10 46 V38 Q10 34 16 34 H22" fill="none" stroke="${c}" stroke-width="2.5"/></svg>`;
  if (m === "上方置換") return `<svg width="${s}" height="${s}" viewBox="0 0 48 48">
    <path d="M17 34 V6 Q17 3 20 3 H28 Q31 3 31 6 V34" fill="none" stroke="${c}" stroke-width="3"/>
    <path d="M24 46 V10" stroke="${c}" stroke-width="3"/><path d="M19 15 L24 9 L29 15" fill="none" stroke="${c}" stroke-width="2.5"/></svg>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 48 48">
    <path d="M17 14 V42 Q17 45 20 45 H28 Q31 45 31 42 V14" fill="none" stroke="${c}" stroke-width="3"/>
    <path d="M24 2 V38" stroke="${c}" stroke-width="3"/><path d="M19 33 L24 39 L29 33" fill="none" stroke="${c}" stroke-width="2.5"/></svg>`;
}
function molecules(q) {
  const none = q.gc === "無色", fill = none ? "#9cc6ff" : HEX[q.gc], st = none ? "#3d7cff" : "#0003";
  const n = Math.min(q.at, 4), r = 9;
  let g = "";
  for (let k = 0; k < 7; k++) {
    const x = 30 + (k % 4) * 75 + Math.random() * 30, y = 30 + (k > 3 ? 55 : 0) + Math.random() * 25;
    let atoms = "";
    if (q.ring) { // ベンゼン環（六角形）
      const pts = Array.from({length: 6}, (_, j) => { const t = Math.PI / 3 * j + k; return `${Math.cos(t) * 14},${Math.sin(t) * 14}`; }).join(" ");
      atoms = `<polygon points="${pts}" fill="#fff8" stroke="${none ? "#3d7cff" : HEX[q.gc]}" stroke-width="3"/><circle r="6" fill="none" stroke="${none ? "#3d7cff" : HEX[q.gc]}" stroke-width="2"/>`;
    } else
    for (let a = 0; a < n; a++) { const ang = a * 2.1 + k; atoms += `<circle cx="${a ? Math.cos(ang) * r * 1.3 : 0}" cy="${a ? Math.sin(ang) * r * 1.3 : 0}" r="${a ? r * .8 : r}" fill="${fill}" stroke="${st}" stroke-width="2"/>`; }
    g += `<g transform="translate(${x} ${y})"><g class="mol" style="--mx:${(Math.random() - .5) * 18}px;--my:${(Math.random() - .5) * 14}px;animation-delay:${-Math.random() * 3}s">${atoms}</g></g>`;
  }
  const bg = none ? "linear-gradient(#eaf3ff,#d5e7ff)" : `linear-gradient(${pastel(q.gc)},color-mix(in srgb, ${HEX[q.gc]} 50%, #fff))`;
  return `<div class="sc-top" style="background:${bg}"><svg viewBox="0 0 340 140" preserveAspectRatio="xMidYMid slice">${g}</svg></div>`;
}
function hearts(l) { return Array.from({length: 3}, (_, i) => `<span class="${i < l ? "" : "x"}">♥</span>`).join(""); }

async function startSwipe(ch) {
  const my = ++run; cur = ch; Q = build(ch); idx = 0; score = 0; combo = 0; got = []; let lives = 3;
  $("hdr").style.display = ""; $("tint").style.opacity = 0;
  const head = () => {
    $("chap").innerHTML = `<small>${ch.no}</small>${ch.swipe.title} <span class="lives">${hearts(lives)}</span>`;
    $("drops").innerHTML = `<div class="bar10" style="width:100%">${Q.map((q, i) => `<i style="background:${i < got.length ? (got[i] ? SWOPT(q.ans).col : "#cfd6e2") : ""}"></i>`).join("")}</div>`;
  };
  head();
  await banner(`<div class="kyotsu">${kyotsuBadge()}</div><div class="big pop">${ch.swipe.big}</div><div class="sub">スワイプで仕分け！ 2択${Q.length}連・ライフ3つ</div>`, 1600);
  for (idx = 0; idx < Q.length; idx++) {
    if (my !== run) return;
    const lv = levelOf(idx, Q.length), last = idx === Q.length - 1;
    if (idx === Math.round(Q.length * .4)) { await banner(`<div class="big pop p">LEVEL UP ▲</div><div class="sub">ひっかけが混ざるよ</div>`, 1200); }
    if (last) { await banner(`<div class="big pop g">ラスボス</div><div class="sub">最後の相手はボス！</div>`, 1300); }
    if (my !== run) return;
    const ok = await swipeQ(q => q, Q[idx], lv, last, my);
    if (my !== run) return;
    if (!ok) lives--;
    head();
    if (lives <= 0) break;
  }
  if (my !== run) return;
  swipeResult(lives);
}

function swipeQ(_, q, lv, last, my) {
  return new Promise(resolve => {
    const opts = cur.swipe.pick(q, lv), trick = lv >= 2 && q.trap && !last;
    const LIMIT = AUTO ? 3000 : 9000;
    stage.innerHTML = `
      <div class="sw-wrap"><div class="scard ${trick ? "trick" : ""} ${last ? "boss" : ""} ${cur.swipe.top ? "tubecard" : ""} flip" id="sc">
        ${trick ? `<div class="sc-tag" style="background:#ff8a3d">ひっかけ注意</div>` : last ? `<div class="sc-tag" style="background:var(--pink)">BOSS</div>` : ""}
        ${cur.swipe.top ? cur.swipe.top(q) : molecules(q)}
        <div class="sc-body">
          <div class="sc-name"><b>${q.nm}</b><span class="f">${q.fm}</span>${cur.swipe.badge(q) ? `<span class="mw">${cur.swipe.badge(q)}</span>` : ""}</div>
          <div class="sc-desc">${q.desc}</div>
          <div class="chips">${cur.swipe.chips.map((c, i) => `<button class="chip" data-k="${i}">${c[0]}</button>`).join("")}</div>
          <div class="sc-timer"><i id="tb"></i></div>
          <div class="sc-note">${AUTO ? "迷ったら止めて考えよう！" : `← 左右にスワイプして${cur.swipe.note} →`}</div>
        </div></div></div>
      <div class="toast" id="toast"></div>
      <div class="sides">${opts.map((o, i) => `<button class="side" data-i="${i}" style="--c:${SWOPT(o).col}"><span class="ring">${apparatus(o)}</span>${o}<span class="arrow">${i ? "右へ →" : "← 左へ"}</span></button>`).join("")}</div>`;
    const sc = $("sc"), sides = stage.querySelectorAll(".side");
    $("tb").animate([{transform:"scaleX(1)"},{transform:"scaleX(0)"}], {duration: LIMIT, fill:"forwards"});
    stage.querySelectorAll(".chip").forEach(c => c.onclick = e => { e.stopPropagation(); c.classList.add("open");
      c.textContent = cur.swipe.chips[+c.dataset.k][1](q); });
    let done = false, tid, sx = null, dx = 0;
    const finish = async i => {
      if (done || my !== run) return; done = true; clearTimeout(tid);
      const pick = i == null ? null : opts[i], ok = AUTO || pick === q.ans;
      got.push(ok); if (ok) { score++; combo++; } else combo = 0;
      sides.forEach((s, k) => { if (opts[k] === q.ans) s.classList.add("right"); else if (k === i) s.classList.add("wrong"); s.classList.remove("hot"); });
      const st = document.createElement("div"); st.className = "stamp2 pop";
      st.style.color = st.style.borderColor = ok ? "var(--mint)" : "var(--pink)"; st.textContent = ok ? "正解" : (pick ? "ざんねん" : "時間切れ");
      sc.appendChild(st);
      if (cur.swipe.reveal) cur.swipe.reveal(sc, q);
      $("toast").innerHTML = ok ? `<span class="ok">✓ 正解！ ${cur.swipe.right ? cur.swipe.right(q) : `${q.nm} → ${q.ans}`}</span>${q.hint ? `<small>💡 ${q.hint}</small>` : ""}${combo >= 3 ? `<small>${combo}連続！</small>` : ""}`
        : `<span class="ng">✗ 正解は ${q.ans}</span><small>💡 ${q.hint || cur.swipe.why(q)}</small>`;
      if (ok) { SE.ok(); burst(sc); } else { SE.ng(); sc.classList.add("wob"); }
      await sleep(AUTO ? 1700 : ok ? (q.hint ? 1500 : 650) : 2200);
      if (my !== run) return;
      const dir = (i ?? (ok ? opts.indexOf(q.ans) : 0)) ? 1 : -1;
      sc.style.transform = `translateX(${dir * 520}px) rotate(${dir * 25}deg)`; sc.style.opacity = 0;
      await sleep(320); resolve(ok);
    };
    // スワイプ操作
    sc.addEventListener("pointerdown", e => { if (done || AUTO || e.target.closest(".chip")) return; sx = e.clientX; dx = 0; sc.classList.add("drag"); sc.setPointerCapture(e.pointerId); });
    sc.addEventListener("pointermove", e => { if (sx == null) return; dx = e.clientX - sx;
      sc.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
      sides.forEach((s, k) => s.classList.toggle("hot", Math.abs(dx) > 40 && (dx > 0) === (k === 1))); });
    const up = () => { if (sx == null) return; sx = null; sc.classList.remove("drag");
      if (Math.abs(dx) > 80) { sc.style.transform = `translateX(${dx * 1.3}px) rotate(${dx / 14}deg)`; finish(dx > 0 ? 1 : 0); }
      else { sc.style.transform = ""; sides.forEach(s => s.classList.remove("hot")); } };
    sc.addEventListener("pointerup", up); sc.addEventListener("pointercancel", up);
    sides.forEach(s => s.onclick = () => { if (!AUTO) finish(+s.dataset.i); });
    tid = setTimeout(() => finish(AUTO ? opts.indexOf(q.ans) : null), LIMIT);
  });
}

function summaryTable() {
  return `<table class="sum">${Q.map((q, i) => i >= got.length ? "" : `<tr><td>${i + 1}</td><td>${q.nm} <span style="font-family:Quicksand">${q.fm}</span></td>
    <td class="m" style="color:${q.ans ? SWOPT(q.ans).col : "var(--ink)"}">${q.ans ? q.ans : drop(q.c, 13).replace("<svg", `<svg style="vertical-align:-2px;margin-right:3px"`) + q.c}</td><td class="mk" style="color:${got[i] ? "var(--mint)" : "var(--pink)"}">${AUTO ? "" : got[i] ? "○" : "×"}</td></tr>`).join("")}</table>`;
}

function swipeResult(lives) {
  $("tint").style.opacity = 0;
  const n = Q.length, r = score === n ? "S" : score / n >= .7 ? "A" : "B";
  if (!AUTO) saveBest(cur.id, r);
  SE.fin();
  stage.innerHTML = `<div class="result" id="res">
    <h2 class="pop">${lives <= 0 ? "ゲームオーバー…" : AUTO ? "何問わかった？" : "クリア！"}</h2>
    ${AUTO ? "" : `<div class="score">${score}<small> / ${n}</small></div><div class="title-b pop">${r}ランク</div>`}
    <div style="font-weight:900;margin-top:6px">今日の${got.length}問まとめ</div>
    ${summaryTable()}
    <div class="save">スクショして直前に見返そう！</div>
    <button class="btn" id="again">もう一回</button>
    <button class="btn sub" id="back">ほかの単元へ</button></div>`;
  $("again").onclick = () => startSwipe(cur); $("back").onclick = menu;
}

menu();
</script>
</body>
</html>
