<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ケミカラ！ 化学の色・反応クイズ</title>
<meta name="description" content="高校化学（無機・有機）を遊びながら覚えるクイズゲーム">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22314f;--pink:#ff6b5b;--lav:#3d7cff;--mint:#18b6a4;--sub:#6b7a99;--sun:#ffc93c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Zen Maru Gothic",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#fff6dc 0%,#e6f3ff 55%,#dcf7ef 100%);background-attachment:fixed}
.pop{font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;font-weight:400}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#deco span{position:absolute;bottom:-40px;opacity:.5;animation:float linear infinite}
@keyframes float{to{transform:translateY(-115vh) rotate(200deg)}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 36px) 20px calc(env(safe-area-inset-bottom) + 36px)}
header{text-align:center;margin-bottom:30px}
.logo{font-size:clamp(44px,9vw,72px);margin:0;line-height:1.1;color:#fff;
  -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;transform:rotate(-3deg);display:inline-block;
  text-shadow:0 6px 0 var(--ink)}
.logo b{color:var(--sun);font-weight:400}
.tag{margin:18px 0 0;font-weight:900;font-size:clamp(15px,2.4vw,19px);color:var(--sub)}
.list{display:grid;gap:26px}
.ed{position:relative;display:flex;align-items:center;gap:18px;text-decoration:none;color:var(--ink);
  background:#fff;border-radius:28px;padding:26px 22px 22px;min-height:132px;
  box-shadow:0 10px 0 var(--sh),0 18px 30px #22314f1f;transition:transform .12s,box-shadow .12s}
.ed::before{content:"";position:absolute;inset:9px;border:3px solid var(--ink);border-radius:20px;pointer-events:none}
.ed:active{transform:translateY(6px);box-shadow:0 4px 0 var(--sh),0 8px 16px #22314f1f}
@media (hover:hover){.ed:hover{transform:translateY(-3px)}}
.ic{flex:none;width:76px;height:76px;border-radius:22px;background:var(--bg);display:grid;place-items:center;font-size:42px}
.ribbon{position:absolute;top:-13px;left:22px;color:#fff;font-family:Quicksand,sans-serif;font-size:15px;
  padding:5px 14px;border-radius:12px;transform:rotate(-5deg);background:var(--c);box-shadow:0 3px 0 var(--sh2)}
.tx h2{margin:0;font-size:clamp(21px,3.2vw,25px);line-height:1.3}
.tx p{margin:6px 0 0;font-size:15px;font-weight:700;color:var(--sub);line-height:1.6}
.go{margin-left:auto;flex:none;width:48px;height:48px;border-radius:50%;background:var(--c);color:#fff;
  display:grid;place-items:center;font-size:24px;box-shadow:0 4px 0 var(--sh2)}
.basic{--c:var(--mint);--sh:#bfeadf;--sh2:#0f8a7c;--bg:#d3f3ea}
.rank{--c:var(--lav);--sh:#cddcf7;--sh2:#2557c9;--bg:#d9ecff}
.org{--c:var(--pink);--sh:#f8d3cd;--sh2:#c9483a;--bg:#fff0c2}
footer{margin-top:34px;text-align:center;font-size:13px;font-weight:700;color:var(--sub);line-height:1.8}
@media (max-width:480px){.ed{gap:12px;padding:24px 16px 18px}.ic{width:56px;height:56px;font-size:32px;border-radius:18px}.go{width:40px;height:40px;font-size:20px}}
@media (prefers-reduced-motion:reduce){#deco{display:none}}
</style>
</head>
<body>
<div id="deco" aria-hidden="true"></div>
<main>
  <header>
    <h1 class="logo pop">ケミカラ<b>！</b></h1>
    <p class="tag">化学の色・反応を、遊びながらマスター！</p>
  </header>
  <nav class="list">
    <a class="ed basic" href="inorganic.html">
      <span class="ribbon">BASIC</span>
      <span class="ic">🧪</span>
      <span class="tx"><h2 class="pop">無機・基本版</h2><p>物質・気体・炎色反応・イオンの色、捕集法、触媒など</p></span>
      <span class="go">▶</span>
    </a>
    <a class="ed rank" href="chemicolor.html">
      <span class="ribbon">ALL-IN-ONE</span>
      <span class="ic">🏆</span>
      <span class="tx"><h2 class="pop">総合版</h2><p>無機・有機・高分子をタブで切り替え。ランキング・ガチャ・合成ラボつき</p></span>
      <span class="go">▶</span>
    </a>
  </nav>
  <footer>記録はこの端末のブラウザに保存されます（ログイン不要）</footer>
</main>
<script>
const deco = document.getElementById("deco"), em = ["🧪","⚗️","💧","🔥","🫧","✨"];
for (let i = 0; i < 12; i++) {
  const s = document.createElement("span");
  s.textContent = em[i % em.length];
  s.style.cssText = `left:${Math.random() * 100}%;font-size:${18 + Math.random() * 18}px;animation-duration:${14 + Math.random() * 12}s;animation-delay:${-Math.random() * 20}s`;
  deco.appendChild(s);
}
</script>
</body>
</html>
